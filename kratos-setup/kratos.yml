version: v0.13.0

dsn: memory # Para testes rápidos. Em produção use postgres://...

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://127.0.0.1:5173
        - http://localhost:5173
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:5173/
  allowed_return_urls:
    - http://127.0.0.1:5173/
    
  methods:
    password:
      enabled: true
  
  flows:
    error:
      ui_url: http://127.0.0.1:5173/error
    settings:
      ui_url: http://127.0.0.1:5173/settings
    recovery:
      ui_url: http://127.0.0.1:5173/recovery
    verification:
      ui_url: http://127.0.0.1:5173/verification
      enabled: true
    logout:
      after:
        default_browser_return_url: http://127.0.0.1:5173/login
    login:
      ui_url: http://127.0.0.1:5173/login
      lifespan: 10m
    registration:
      ui_url: http://127.0.0.1:5173/register
      lifespan: 10m

log:
  level: debug

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  argon2:
    parallelism: 1
    memory: 128MB
    iterations: 3
    salt_length: 16
    key_length: 32

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://test:test@mailslurper:2500/?disable_starttls=true